</select>

</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">

<input class="w-full bg-surface border border-outline-variant rounded-lg p-md font-body-lg focus:border-primary focus:ring-1 focus:ring-primary" type="date" value="2023-10-27"/>

<!-- Item Input Group -->

<div class="flex flex-col gap-xs">

<option value="Cakalang">

<script>
        const inputWeight = document.getElementById('input-weight');
        const inputPrice = document.getElementById('input-price');
        const displayTotalWeight = document.getElementById('total-weight');
        const displayTotalPrice = document.getElementById('total-price');

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        }

        function calculate() {
            const weight = parseFloat(inputWeight.value) || 0;
            const price = parseFloat(inputPrice.value) || 0;
            const total = weight * price;

            displayTotalWeight.innerText = `${weight.toLocaleString('id-ID')} kg`;
            displayTotalPrice.innerText = formatRupiah(total);
        }

        inputWeight.addEventListener('input', calculate);
        inputPrice.addEventListener('input', calculate);

        function setStatus(type) {
            const btnPaid = document.getElementById('btn-paid');
            const btnDebt = document.getElementById('btn-debt');
            
            if (type === 'paid') {
                btnPaid.className = 'flex items-center justify-center gap-xs py-md rounded-lg font-bold transition-all duration-200 bg-white shadow-sm text-primary';
                btnDebt.className = 'flex items-center justify-center gap-xs py-md rounded-lg font-bold transition-all duration-200 text-on-surface-variant';
                displayTotalPrice.classList.remove('text-error');
                displayTotalPrice.classList.add('text-primary');
            } else {
                btnDebt.className = 'flex items-center justify-center gap-xs py-md rounded-lg font-bold transition-all duration-200 bg-white shadow-sm text-error';
                btnPaid.className = 'flex items-center justify-center gap-xs py-md rounded-lg font-bold transition-all duration-200 text-on-surface-variant';
                displayTotalPrice.classList.remove('text-primary');
                displayTotalPrice.classList.add('text-error');
            }
        }
    </script>
