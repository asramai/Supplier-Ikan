<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center px-margin-mobile">
<!-- Atmospheric Subtle Background Element (Optional micro-interaction) -->
<div class="fixed inset-0 -z-10 overflow-hidden opacity-20 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[40%] bg-primary-container/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[35%] bg-secondary-container/20 blur-[100px] rounded-full"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Logo & Branding Section -->
<header class="flex flex-col items-center mb-xl animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="w-20 h-20 bg-primary-container rounded-xl flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-[48px] text-white" style="font-variation-settings: 'FILL' 1;">waves</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Asy-Syifa Panua</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Fishery &amp; Financial Management</p>
</header>
<!-- Login Form -->
<form class="w-full flex flex-col gap-lg animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-150">
<!-- Username Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="username">USERNAME</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full h-[56px] pl-[48px] pr-md bg-white border border-outline-variant rounded-lg font-body-lg text-body-lg transition-all focus:ring-0" id="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">PASSWORD</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-[56px] pl-[48px] pr-[56px] bg-white border border-outline-variant rounded-lg font-body-lg text-body-lg transition-all focus:ring-0" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-md pt-xs">
<button class="w-full h-[56px] bg-primary-container hover:bg-primary text-on-primary font-headline-md text-headline-md rounded-lg shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="flex justify-center">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-xs" href="#">
                        FORGOT PASSWORD?
                    </a>
</div>
</div>
</form>
<!-- Footer / Additional Links -->
<footer class="mt-xl flex flex-col items-center gap-md animate-in fade-in duration-1000 delay-300">
<div class="flex items-center gap-sm">
<div class="h-[1px] w-12 bg-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant">SECURE ACCESS</span>
<div class="h-[1px] w-12 bg-outline-variant"></div>
</div>
<div class="flex gap-lg">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-md text-label-md uppercase">Encrypted</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">gpp_good</span>
<span class="font-label-md text-label-md uppercase">Certified</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-lg">
                Don't have an account? <a class="text-primary font-bold hover:underline" href="#">Contact Admin</a>
</p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('button[type="submit"]');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                // Visual feedback for interaction
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    submitBtn.innerHTML = 'Login';
                    submitBtn.disabled = false;
                    // In a real app, logic would go here
                }, 1500);
            });

            // Password visibility toggle logic
            const togglePassword = document.querySelector('button[type="button"]');
            const passwordInput = document.querySelector('#password');
            
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.querySelector('span').innerText = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
</body></html>
